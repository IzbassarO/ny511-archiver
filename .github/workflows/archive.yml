name: archive-511ny
# Runs only on schedule or by the owner's manual button: no pull_request / pull_request_target triggers,
# so forks can never run this workflow or see its secrets.
on:
  schedule:
    - cron: "7,37 * * * *"   # odd minutes: GitHub delays/drops runs at :00 and :30
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'IzbassarO/ny511-archiver'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: IzbassarO/ny511-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}   # fine-grained, only ny511-archive, contents: write
          path: archive
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: archive/.state-cache
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-
      - name: Fetch and archive
        env:
          ARCHIVE_ROOT: archive
          NY511_USERNAME: ${{ secrets.NY511_USERNAME }}
          NY511_PASSWORD: ${{ secrets.NY511_PASSWORD }}
        run: python3 archive.py   # prints counts and timings only (this repo's logs are public)
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive/.state-cache
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit to the data repo if data changed
        if: always()
        working-directory: archive
        run: |
          if [ -n "$(git status --porcelain data state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data state
            git commit -q -m "511NY archive $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          else
            echo "no data change; nothing committed"
          fi
